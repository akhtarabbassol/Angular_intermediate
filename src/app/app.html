<section class="w-screen h-screen flex flex-col justify-center items-center gap-1.5">
    <div class="w-2/5 h-2/5 bg-gray-600 flex flex-col justify-center items-center gap-2
     rounded-md ">
        <h1 class="text-white font-semibold">Parent Card </h1>
        <div  class="w-full flex flex-col justify-center items-center p-1 gap-1">
            <div class="w-full flex justify-center gap-3">
            <input #Name class="w-2/5 bg-gray-200 rounded-md ">
            <button class="bg-green-500 rounded-md text-white font-semibold
            p-0.5" (click)="Name.focus()">Focus</button>
              </div>
            <div class="w-full flex justify-center gap-3">
            <input #Email class="w-2/5 bg-gray-200 rounded-md ">
            <button class="bg-green-500 rounded-md text-white font-semibold
            p-0.5" (click)="Email.focus()">Focus</button>
              </div>
        </div>
        <button (click)="Send(Name.value , Email.value)">Send to Child</button>
    </div>
    <child-app class="w-2/5 h2/5 bg-gray-600 rounded-md p-2"
     [userName]="ChildName" [userEmail]="ChildEmail"></child-app>
</section>
