<div class="min-h-screen bg-gray-100 p-8">

  <!-- HEADER -->

  <div class="max-w-6xl mx-auto">

    <h1 class="text-3xl font-bold mb-6">
      Product Dashboard
    </h1>


    <!-- SEARCH -->

    <div class="bg-white p-5 rounded-xl shadow mb-6">

      <input
        [(ngModel)]="searchText"
        placeholder="Search product..."
        class="border p-3 rounded-lg w-full"
      >

    </div>


    <!-- FILTER -->

    <div class="flex gap-4 mb-6">

      <select
        [(ngModel)]="selectedCategory"
        class="border p-3 rounded-lg"
      >

        <option value="All">All</option>

        <option value="Mobile">
          Mobile
        </option>

        <option value="Laptop">
          Laptop
        </option>

      </select>


      <!-- Theme -->

      <select
        [(ngModel)]="selectedColor"
        class="border p-3 rounded-lg"
      >

        <option value="blue">
          Blue Theme
        </option>

        <option value="purple">
          Purple Theme
        </option>

        <option value="green">
          Green Theme
        </option>

      </select>

    </div>


    <!-- PRODUCTS -->

    <div class="grid grid-cols-3 gap-6">

      @for (product of filteredProducts; track product.name) {

        <div
          class="bg-white rounded-xl shadow p-5 border-4"
          [ngClass]="getThemeClass()"
        >

          <!-- PRODUCT NAME -->

          <h2 class="text-xl font-bold">
            {{ product.name }}
          </h2>


          <p class="text-gray-500">
            {{ product.category }}
          </p>


          <!-- PRICE -->

          <p class="text-lg font-semibold mt-3">

            Rs. {{ product.price }}

          </p>


          <!-- STATUS -->

          <div
            class="mt-3 p-2 rounded text-white text-center"
            [ngClass]="{
              'bg-green-500':
                product.status === 'Available',

              'bg-red-500':
                product.status === 'Out of Stock'
            }"
          >

            {{ product.status }}

          </div>


          <!-- STOCK -->

          <p class="mt-3">

            Stock:
            <strong>{{ product.stock }}</strong>

          </p>


          <!-- PROGRESS -->

          <div class="mt-4">

            <p class="text-sm mb-1">
              Stock Level
            </p>


            <div class="w-full bg-gray-200 rounded-full h-4">

              <div
                class="h-4 rounded-full"
                [ngStyle]="{
                  'width.%': product.progress,
                  'background-color':
                    getProgressColor(product.progress)
                }"
              >
              </div>

            </div>


            <p class="text-sm mt-1">

              {{ product.progress }}%

            </p>

          </div>


          <!-- BUTTON -->

          <button
            (click)="changeStatus(product)"
            class="mt-5 w-full bg-black text-white p-2 rounded-lg"
          >

            Change Status

          </button>

        </div>

      }

    </div>


    <!-- NO PRODUCTS -->

    @if (filteredProducts.length === 0) {

      <div class="text-center mt-10">

        <h2 class="text-xl">
          No products found
        </h2>

      </div>

    }

  </div>

</div>
