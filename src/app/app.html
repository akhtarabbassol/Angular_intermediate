<section class="w-screen h-screen flex flex-col justify-center items-center gap-2">
   <div class="w-2/5 h-1/3 bg-gray-600 rounded-md flex 
   flex-col justify-center items-center gap-2">
    <div class="w-full flex justify-evenly">
    <input type="text" class="w-2/4 bg-gray-200 rounded-sm" #username>
    <button class="w-1/4 bg-green-400 text-white font-semibold border-2
     hover:bg-white hover:text-green-400 rounded-md" (click)="username.focus()">Focus</button>
    </div>
        <div class="w-full flex justify-evenly">
    <input type="text" class="w-2/4 bg-gray-200 rounded-sm" #useremail>
    <button class="w-1/4 bg-green-400 text-white font-semibold border-2
     hover:bg-white hover:text-green-400 rounded-md" (click)="useremail.focus()">Focus</button>
    </div>
    <div class="w-full flex justify-evenly">
    <input type="number" class="w-2/4 bg-gray-200 rounded-sm" #userphone>
    <button class="w-1/4 bg-green-400 text-white font-semibold border-2
     hover:bg-white hover:text-green-400 rounded-md" (click)="userphone.focus()">Focus</button>
    </div>
    <button class="border-2 bg-blue-500 rounded-md w-3/4 text-white
    cursor-pointer hover:text-blue-500 hover:bg-white"
    (click)="SendData(username.value , useremail.value , +userphone.value)">Send Data</button>
   </div>
  <child-app class="w-2/5 h-1/3 bg-gray-600 rounded-md flex flex-col justify-center items-center"
  [user1]="User"></child-app>
</section>
